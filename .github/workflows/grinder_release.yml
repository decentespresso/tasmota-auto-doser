name: Grinder firmware release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: grinder-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRINDER_VARIANTS: '["tasmota32-nous-a6t-grinder", "tasmota32-grinder", "tasmota32c3-athom-eu-v3-grinder"]'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.variants.outputs.variants }}
    steps:
      - uses: actions/checkout@v6
      - id: variants
        run: echo "variants=$GRINDER_VARIANTS" >> "$GITHUB_OUTPUT"
      - name: Build and run grinder host tests
        run: |
          mkdir -p build/host-tests
          g++ -std=c++17 tools/grinder_tcp_protocol_test.cpp -o build/host-tests/grinder_tcp_protocol_test
          g++ -std=c++17 tools/grinder_tcp_driver_sim_test.cpp -o build/host-tests/grinder_tcp_driver_sim_test
          ./build/host-tests/grinder_tcp_protocol_test
          ./build/host-tests/grinder_tcp_driver_sim_test
          python3 -B tools/test_grinder_mdns_probe.py -v
          python3 tools/test_grinder_update_lifecycle.py
          python3 tools/test_grinder_empty_ota.py
          python3 tools/test_wifi_config_scan.py
          python3 tools/test_grinder_session_deadlines.py
      - name: Test release publication offline
        run: python3 -B tools/grinder_release_publish_test.py

  firmware:
    needs: host-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.host-tests.outputs.variants) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false
      - name: Install dependencies
        run: |
          uv pip install --system pioarduino
          cp ./platformio_override_sample.ini ./platformio_override.ini
      - name: Build firmware
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: platformio run -e ${{ matrix.variant }}
      - name: Collect firmware assets
        run: |
          mkdir -p release
          cp build_output/firmware/${{ matrix.variant }}.bin release/${{ matrix.variant }}.bin
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}
          path: release/*.bin
          if-no-files-found: error

  release:
    needs: firmware
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: python3 -B tools/grinder_release_publish.py "$GITHUB_REPOSITORY" "$TAG_NAME" release "$GRINDER_VARIANTS"
